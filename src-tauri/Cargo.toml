[package]
name = "jterm"
version = "0.1.0"
description = "A fast, native terminal for macOS and Windows with tabs, split panes, and full mouse support"
authors = ["Yosef Ashenafi"]
edition = "2021"
license = "MIT"
repository = "https://github.com/YosefAshenafi/jterm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
sysinfo = "0.32"
png = "0.17"

# Read file references off the macOS clipboard (an image copied in Finder lands
# on the pasteboard as a file URL, not raw image bytes).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
