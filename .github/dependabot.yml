# Automated dependency update PRs. Dependabot also opens security PRs for known
# vulnerabilities in these ecosystems. See:
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Frontend dependencies (pnpm-lock.yaml is read via the npm ecosystem).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Rust backend dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions pinned in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
